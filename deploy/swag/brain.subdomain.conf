## Version 2024/10/15
# Obsidian Brain — reverse proxy for the streamable-HTTP MCP server + web UI.
# Upstream: obsidian-brain-mcp:8000 on the `backend` docker network.
# AUTH: the brain requires an Authorization: Bearer <token> on every route except
# GET /health and the GET /ui HTML shell (BRAIN_AUTH_TOKEN in the compose .env).
# That bearer token is the gate for the browser UI, the Obsidian plugin, and MCP
# agents alike. To ALSO put an Authelia login in front of the browser shell,
# uncomment the authelia-server.conf include below plus the authelia-location.conf
# include inside `location /` and `location = /ui` ONLY (leave /ui/api, /mcp,
# /refresh bearer-only so the plugin/agents keep working).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name brain.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # enable for Authelia in front of the browser UI (see note above)
    #include /config/nginx/authelia-server.conf;

    location / {
        # enable for Authelia (browser shell only — see note above)
        #include /config/nginx/authelia-location.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app obsidian-brain-mcp;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    location /mcp {
        # MCP streamable-HTTP endpoint (agents; bearer-only, never Authelia).
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app obsidian-brain-mcp;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept "application/json, text/event-stream";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }
}
